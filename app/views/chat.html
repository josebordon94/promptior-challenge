<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Promptior RAG Chat</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <h2 class="mb-4">Promptior RAG Chatbot</h2>

      <ul id="chat" class="list-group mb-3"></ul>

      <textarea id="input" class="form-control mb-2" rows="3">
{{ default_question }}</textarea
      >

      <button class="btn btn-primary" onclick="send()">Send message</button>
    </div>

    <script src="/static/chat.js"></script>
  </body>
</html>
